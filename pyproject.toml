[build-system]
requires = ["meson-python==0.18.0", "meson==1.9.1", "ninja==1.13.0", "pybind11==3.0.1"]
build-backend = "mesonpy"

[project]
name = "vnpy_ctp"
dynamic = ["version"]
description = "Patched, trading-only CTP bindings extracted from ccxt-proxy2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/hxse/vnpy-ctp"
Releases = "https://github.com/hxse/vnpy-ctp/releases"
Upstream = "https://github.com/vnpy/vnpy_ctp"

[tool.meson-python.args]
setup = ["--vsenv"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["native", "vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = "*-musllinux* *-manylinux_i686 *-win32 *-win_arm64"
build-frontend = "build"
test-command = "python {project}/tests/native/check_wheel.py"
test-requires = ["meson==1.9.1", "ninja==1.13.0", "pybind11==3.0.1"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { CC = "cl", CXX = "cl" }
before-build = "python -m pip install delvewheel==1.13.1"
repair-wheel-command = "delvewheel repair --add-path vendor/ctp/windows-x86_64 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["auto"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
before-build = "python -m pip install wheel==0.45.1"
repair-wheel-command = "python {project}/scripts/repair_macos.py {wheel} {dest_dir} {delocate_archs}"
