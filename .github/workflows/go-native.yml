name: Build and release Go native SDK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: go-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.existing.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/check_source.py
      - run: python -m ruff check scripts tests src
      - run: python -m pytest tests/unit -q
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.go_native .release/go "$GITHUB_SHA" "$GITHUB_REPOSITORY" --check-existing

  native:
    name: Linux amd64 / glibc 2.28
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: native/go/.go-version
          cache: false
      - name: Build and test packaged C ABI offline
        env:
          CONTAINER_ENGINE: docker
        run: bash scripts/go_native_container.sh .release/go "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-native-linux-amd64
          path: .release/go/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [prepare, native]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-native-linux-amd64
          path: .release/go
      - run: python -m pip install packaging==25.0
      - name: Verify archive and publish Go Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.go_native .release/go "$GITHUB_SHA" "$GITHUB_REPOSITORY"
